<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Dolce far niente</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
* { box-sizing:border-box; margin:0; padding:0; }
:root { --bg:#f8f6f2; --surface:#fff; --black:#111; --gray:#888; --border:rgba(0,0,0,0.09); --accent:#c8b89a; --success:#2e7d52; --danger:#c0392b; }
body { font-family:'Jost',sans-serif; font-weight:300; background:var(--bg); color:var(--black); min-height:100vh; padding:2rem 1.5rem 4rem; max-width:1100px; margin:0 auto; }

h1 { font-family:'Cormorant Garamond',serif; font-style:italic; font-weight:300; font-size:2rem; letter-spacing:.04em; margin-bottom:.3rem; }
.subtitle { font-size:.68rem; letter-spacing:.18em; text-transform:uppercase; color:var(--gray); margin-bottom:2rem; }

/* Tab bar */
.tab-bar { display:flex; gap:0; border-bottom:1px solid var(--border); margin-bottom:1.5rem; flex-wrap:wrap; }
.tab-btn { background:none; border:none; border-bottom:2px solid transparent; padding:.6rem 1.2rem; font-family:'Jost',sans-serif; font-size:.68rem; font-weight:300; letter-spacing:.18em; text-transform:uppercase; color:var(--gray); cursor:pointer; transition:all .2s; }
.tab-btn:hover { color:var(--black); }
.tab-btn.active { color:var(--black); border-bottom-color:var(--black); }
.tab-count { font-size:.58rem; color:var(--accent); margin-left:.3rem; }

/* Photo grid — admin style */
.admin-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(180px,1fr)); gap:12px; margin-bottom:1.5rem; min-height:100px; }
.admin-card { position:relative; background:var(--surface); border:1px solid var(--border); border-radius:3px; overflow:hidden; cursor:grab; transition:box-shadow .2s, transform .15s; }
.admin-card:active { cursor:grabbing; }
.admin-card.dragging { opacity:.4; transform:scale(.95); }
.admin-card.drag-over { box-shadow:0 0 0 2px var(--accent); }
.admin-card img { width:100%; aspect-ratio:3/2; object-fit:cover; display:block; pointer-events:none; }
.admin-card .card-info { padding:.5rem .6rem; }
.admin-card .card-filename { font-size:.6rem; color:var(--gray); letter-spacing:.05em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:.3rem; }
.admin-card .card-caption { width:100%; border:1px solid var(--border); border-radius:2px; padding:.3rem .4rem; font-family:'Jost',sans-serif; font-size:.7rem; font-weight:300; outline:none; background:transparent; }
.admin-card .card-caption:focus { border-color:var(--accent); }
.admin-card .card-caption::placeholder { color:#ccc; }
.admin-card .card-del { position:absolute; top:4px; right:4px; width:22px; height:22px; border-radius:50%; background:rgba(0,0,0,0.5); color:#fff; border:none; cursor:pointer; font-size:.8rem; line-height:22px; text-align:center; opacity:0; transition:opacity .2s; }
.admin-card:hover .card-del { opacity:1; }
.admin-card .card-del:hover { background:var(--danger); }
.admin-card .card-num { position:absolute; top:4px; left:4px; min-width:20px; height:20px; border-radius:10px; background:rgba(0,0,0,0.45); color:#fff; font-size:.55rem; line-height:20px; text-align:center; padding:0 5px; pointer-events:none; }

/* Add photos area */
.add-area { border:1.5px dashed var(--accent); border-radius:3px; padding:1.5rem; text-align:center; cursor:pointer; transition:background .2s; position:relative; margin-bottom:1.5rem; }
.add-area:hover { background:rgba(200,184,154,0.07); }
.add-area input { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.add-area p { font-size:.8rem; color:var(--gray); }

/* Action bar */
.action-bar { display:flex; gap:.8rem; flex-wrap:wrap; align-items:center; padding:1rem 0; border-top:1px solid var(--border); position:sticky; bottom:0; background:var(--bg); z-index:10; }
.btn { padding:.55rem 1.5rem; font-family:'Jost',sans-serif; font-size:.65rem; font-weight:300; letter-spacing:.2em; text-transform:uppercase; border-radius:2px; cursor:pointer; transition:all .2s; }
.btn-primary { background:var(--black); color:#fff; border:1px solid var(--black); }
.btn-primary:hover { background:#333; }
.btn-accent { background:var(--accent); color:#fff; border:1px solid var(--accent); }
.btn-accent:hover { background:#b8a48a; }
.btn-outline { background:none; color:var(--black); border:1px solid var(--border); }
.btn-outline:hover { border-color:var(--black); }
.btn-danger { background:none; color:var(--danger); border:1px solid var(--danger); }
.btn-danger:hover { background:var(--danger); color:#fff; }

.status { font-size:.72rem; color:var(--success); margin-left:.5rem; }
.status.warn { color:var(--danger); }

/* Loading */
.loading { text-align:center; padding:3rem; color:var(--gray); font-size:.8rem; }

/* Empty state */
.empty { text-align:center; padding:2rem; color:var(--gray); font-size:.75rem; }
</style>
</head>
<body>

<h1>Photo Manager</h1>
<p class="subtitle">Drag to reorder · Click caption to edit · Download updated JSON</p>

<div id="loading" class="loading">Loading photos.json…</div>
<div id="main" style="display:none;">
  <div class="tab-bar" id="tab-bar"></div>
  <div id="grid-wrap">
    <div class="admin-grid" id="admin-grid"></div>
  </div>
  <div class="add-area" id="add-area">
    <input type="file" id="add-input" accept=".jpg,.JPG,.jpeg,.JPEG,.png,.PNG,.webp,.WEBP" multiple>
    <p>＋ 點擊或拖曳新增照片到目前分類</p>
  </div>
  <div class="action-bar">
    <button class="btn btn-primary" onclick="downloadJSON()">Download photos.json</button>
    <button class="btn btn-outline" onclick="copyJSON()">Copy JSON</button>
    <button class="btn btn-outline" onclick="reloadFromFile()">Reload from file</button>
    <button class="btn btn-danger" onclick="undoChanges()">Undo All</button>
    <span id="status" class="status"></span>
  </div>
</div>

<script>
/* ── STATE ── */
let DATA = null;        // the full photos.json object
let DATA_ORIG = null;   // backup for undo
let currentKey = '';    // e.g. 'italy.rome' or 'routine'

const FOLDER_MAP = {
  'italy.rome':     'Italy/Rome',
  'italy.vatican':  'Italy/Vatican',
  'italy.firenze':  'Italy/Firenze',
  'italy.napoli':   'Italy/Napoli',
  'japan.miyako':   'Japan/Miyako',
  'japan.hokkaido': 'Japan/Hokkaido',
  'japan.okinawa':  'Japan/Okinawa',
  'routine':        'Routine',
};

const TAB_LABELS = {
  'italy.rome':     'Italy · Rome',
  'italy.vatican':  'Italy · Vatican',
  'italy.firenze':  'Italy · Firenze',
  'italy.napoli':   'Italy · Napoli',
  'japan.miyako':   'Japan · Miyako',
  'japan.hokkaido': 'Japan · Hokkaido',
  'japan.okinawa':  'Japan · Okinawa',
  'routine':        'Routine',
};

/* ── HELPERS ── */
function getPhotos(key) {
  if (!DATA) return [];
  const parts = key.split('.');
  if (parts.length === 2) return (DATA[parts[0]] || {})[parts[1]] || [];
  return DATA[key] || [];
}

function setPhotos(key, arr) {
  const parts = key.split('.');
  if (parts.length === 2) {
    if (!DATA[parts[0]]) DATA[parts[0]] = {};
    DATA[parts[0]][parts[1]] = arr;
  } else {
    DATA[key] = arr;
  }
  autoSave();
}

/* Auto-save to localStorage on every change */
function autoSave() {
  try { localStorage.setItem('photos_admin_draft', JSON.stringify(DATA)); } catch(e) {}
}

/* ── LOAD ── */
/* Priority: localStorage draft > photos.json */
function initApp(data, source) {
  DATA = data;
  DATA_ORIG = JSON.parse(JSON.stringify(data));
  document.getElementById('loading').style.display = 'none';
  document.getElementById('main').style.display = '';
  buildTabs();
  const firstKey = Object.keys(TAB_LABELS)[0];
  switchTo(firstKey);
  if (source === 'draft') showStatus('📌 已載入上次未儲存的草稿');
}

(function loadData() {
  // Check if there's a saved draft
  let draft = null;
  try {
    const raw = localStorage.getItem('photos_admin_draft');
    if (raw) draft = JSON.parse(raw);
  } catch(e) {}

  // Always fetch photos.json as baseline
  fetch('photos.json')
    .then(r => r.json())
    .then(fileData => {
      if (draft) {
        // Show option to choose draft or fresh
        DATA_ORIG = JSON.parse(JSON.stringify(fileData));
        initApp(draft, 'draft');
      } else {
        initApp(fileData, 'file');
      }
    })
    .catch(err => {
      // If fetch fails but draft exists, use draft
      if (draft) {
        initApp(draft, 'draft');
      } else {
        document.getElementById('loading').innerHTML =
          '<span class="status warn">❌ 無法載入 photos.json — 請確認檔案存在於同一目錄</span>';
        console.error(err);
      }
    });
})();

/* ── TABS ── */
function buildTabs() {
  const bar = document.getElementById('tab-bar');
  bar.innerHTML = '';
  Object.entries(TAB_LABELS).forEach(([key, label]) => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn';
    btn.dataset.key = key;
    const count = getPhotos(key).length;
    btn.innerHTML = label + '<span class="tab-count">' + count + '</span>';
    btn.onclick = () => switchTo(key);
    bar.appendChild(btn);
  });
}

function switchTo(key) {
  currentKey = key;
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.key === key);
  });
  renderGrid();
}

/* ── RENDER GRID ── */
function renderGrid() {
  const grid = document.getElementById('admin-grid');
  const photos = getPhotos(currentKey);

  if (!photos.length) {
    grid.innerHTML = '<div class="empty">此分類尚無照片</div>';
    return;
  }

  grid.innerHTML = '';
  photos.forEach((photo, i) => {
    const card = document.createElement('div');
    card.className = 'admin-card';
    card.draggable = true;
    card.dataset.index = i;

    const filename = photo.src.split('/').pop();

    card.innerHTML =
      '<span class="card-num">' + (i + 1) + '</span>' +
      '<button class="card-del" title="刪除" data-i="' + i + '">×</button>' +
      '<img src="' + (photo.thumb || photo.src) + '" alt="" loading="lazy" onerror="this.src=\'' + photo.src + '\'">' +
      '<div class="card-info">' +
        '<div class="card-filename">' + filename + '</div>' +
        '<input class="card-caption" type="text" placeholder="Caption…" value="' + escHtml(photo.caption || '') + '" data-i="' + i + '">' +
      '</div>';

    grid.appendChild(card);
  });

  // Attach events
  attachDragEvents();
  attachCaptionEvents();
  attachDeleteEvents();
  updateTabCounts();
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ── DRAG & DROP SORT ── */
let dragIdx = null;

function attachDragEvents() {
  const grid = document.getElementById('admin-grid');
  const cards = grid.querySelectorAll('.admin-card');

  cards.forEach(card => {
    card.addEventListener('dragstart', e => {
      dragIdx = +card.dataset.index;
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    card.addEventListener('dragend', () => {
      card.classList.remove('dragging');
      document.querySelectorAll('.drag-over').forEach(c => c.classList.remove('drag-over'));
      dragIdx = null;
    });
    card.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      card.classList.add('drag-over');
    });
    card.addEventListener('dragleave', () => {
      card.classList.remove('drag-over');
    });
    card.addEventListener('drop', e => {
      e.preventDefault();
      card.classList.remove('drag-over');
      const dropIdx = +card.dataset.index;
      if (dragIdx === null || dragIdx === dropIdx) return;

      const photos = getPhotos(currentKey);
      const moved = photos.splice(dragIdx, 1)[0];
      photos.splice(dropIdx, 0, moved);
      setPhotos(currentKey, photos);

      renderGrid();
      showStatus('排序已更新');
    });
  });
}

/* ── CAPTION EDIT ── */
function attachCaptionEvents() {
  document.querySelectorAll('.card-caption').forEach(input => {
    input.addEventListener('change', function() {
      const i = +this.dataset.i;
      const photos = getPhotos(currentKey);
      if (photos[i]) {
        photos[i].caption = this.value.trim();
        autoSave();
        showStatus('Caption 已更新');
      }
    });
  });
}

/* ── DELETE ── */
function attachDeleteEvents() {
  document.querySelectorAll('.card-del').forEach(btn => {
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      const i = +this.dataset.i;
      const photos = getPhotos(currentKey);
      const filename = photos[i]?.src.split('/').pop() || '';
      if (!confirm('刪除 ' + filename + '？')) return;
      photos.splice(i, 1);
      setPhotos(currentKey, photos);
      renderGrid();
      showStatus('已刪除 ' + filename);
    });
  });
}

/* ── ADD PHOTOS ── */
document.getElementById('add-input').addEventListener('change', function(e) {
  const files = Array.from(e.target.files).filter(f => /\.(jpe?g|png|webp)$/i.test(f.name));
  if (!files.length) return;

  const folder = FOLDER_MAP[currentKey] || '';
  const photos = getPhotos(currentKey);

  let added = 0;
  const existingNames = new Set(photos.map(p => p.src.split('/').pop()));
  const tasks = [];

  files.forEach(f => {
    if (existingNames.has(f.name)) return; // skip duplicates
    tasks.push(getDimensions(f).then(({w, h}) => {
      const src = 'images/' + folder + '/' + f.name;
      const thumb = 'images/' + folder + '/thumbs/' + f.name;
      photos.push({ src, width: w, height: h, caption: '', thumb });
      added++;
    }));
  });

  Promise.all(tasks).then(() => {
    setPhotos(currentKey, photos);
    renderGrid();
    showStatus('新增 ' + added + ' 張照片');
    // reset input
    e.target.value = '';
  });
});

function getDimensions(file) {
  return new Promise(resolve => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload  = () => { resolve({ w: img.naturalWidth, h: img.naturalHeight }); URL.revokeObjectURL(url); };
    img.onerror = () => { resolve({ w: 0, h: 0 }); URL.revokeObjectURL(url); };
    img.src = url;
  });
}

/* ── EXPORT ── */
function downloadJSON() {
  const json = JSON.stringify(DATA, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'photos.json'; a.click();
  URL.revokeObjectURL(url);
  // Update baseline and clear draft
  DATA_ORIG = JSON.parse(JSON.stringify(DATA));
  try { localStorage.removeItem('photos_admin_draft'); } catch(e) {}
  showStatus('✓ photos.json 已下載 — 請取代舊檔後 push');
}

function copyJSON() {
  const json = JSON.stringify(DATA, null, 2);
  navigator.clipboard.writeText(json).then(() => {
    showStatus('✓ 已複製到剪貼簿');
  }).catch(() => {
    // fallback
    const ta = document.createElement('textarea');
    ta.value = json;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showStatus('✓ 已複製到剪貼簿');
  });
}

function undoChanges() {
  if (!confirm('還原所有變更？（會清除未儲存的草稿）')) return;
  DATA = JSON.parse(JSON.stringify(DATA_ORIG));
  try { localStorage.removeItem('photos_admin_draft'); } catch(e) {}
  renderGrid();
  buildTabs();
  document.querySelector('.tab-btn[data-key="' + currentKey + '"]')?.classList.add('active');
  showStatus('已還原至 photos.json 原始狀態');
}

function reloadFromFile() {
  if (!confirm('從 photos.json 重新載入？（會捨棄所有未下載的變更）')) return;
  try { localStorage.removeItem('photos_admin_draft'); } catch(e) {}
  fetch('photos.json?t=' + Date.now())
    .then(r => r.json())
    .then(data => {
      initApp(data, 'file');
      showStatus('✓ 已從 photos.json 重新載入');
    })
    .catch(err => showStatus('❌ 載入失敗'));
}

/* ── UI HELPERS ── */
function updateTabCounts() {
  document.querySelectorAll('.tab-btn').forEach(btn => {
    const key = btn.dataset.key;
    const count = getPhotos(key).length;
    btn.querySelector('.tab-count').textContent = count;
  });
}

function showStatus(msg) {
  const el = document.getElementById('status');
  el.textContent = msg;
  clearTimeout(el._t);
  el._t = setTimeout(() => el.textContent = '', 3000);
}
</script>
</body>
</html>
